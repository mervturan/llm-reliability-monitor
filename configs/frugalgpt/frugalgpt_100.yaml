run:
  name: squad_frugalgpt_qwen05_to_qwen3_100
  seed: 42
  output_root: outputs

dataset:
  calibration_size: 100
  test_size: 100
  context_pool_size: 500

delegation:
  policy: frugalgpt

retrieval:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  top_k: 3
  batch_size: 32

generation:
  small_model:
    model_name: Qwen/Qwen2.5-0.5B-Instruct
    max_new_tokens: 48
    temperature: 0.0
    num_consistency_samples: 1
    device: auto
    
cost:
  small_model_relative_cost: 1.0
  large_model_relative_cost: 6.0

  large_model:
    model_name: Qwen/Qwen2.5-3B-Instruct
    max_new_tokens: 48
    temperature: 0.0
    device: auto

monitoring:
  enabled_signals:
    - retrieval
    - faithfulness

  target_risk: 0.20
  flag_margin: 0.08

  score_weights:
    retrieval: 0.45
    faithfulness: 0.55
    consistency: 0.00