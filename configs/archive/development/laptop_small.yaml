run:
  name: squad_laptop_small
  seed: 42
  output_root: outputs

dataset:
  calibration_size: 50
  test_size: 100
  context_pool_size: 500

retrieval:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  top_k: 3
  batch_size: 64

generation:
  model_name: Qwen/Qwen2.5-0.5B-Instruct
  max_new_tokens: 64
  temperature: 0.0
  num_consistency_samples: 1
  device: auto

monitoring:
  target_risk: 0.10
  flag_margin: 0.05
  score_weights:
    retrieval: 0.40
    faithfulness: 0.45
    consistency: 0.15
