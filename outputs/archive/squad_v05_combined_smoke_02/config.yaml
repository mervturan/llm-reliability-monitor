run:
  name: squad_v05_combined_smoke
  seed: 42
  output_root: outputs
dataset:
  name: squad
  calibration_size: 100
  test_size: 100
  context_pool_size: 500
retrieval:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  top_k: 3
  batch_size: 32
generation:
  model_name: Qwen/Qwen2.5-0.5B-Instruct
  max_new_tokens: 48
  temperature: 0.0
  num_consistency_samples: 1
  device: auto
monitoring:
  enabled_signals:
  - retrieval
  - faithfulness
  target_risk: 0.2
  flag_margin: 0.08
  score_weights:
    retrieval: 0.45
    faithfulness: 0.55
    consistency: 0.0
